# Twice a day: pull pages edited on the BI wiki since the last run, re-parse them and commit the result.
# The code lives in a3ref/a3ref.github.io; that repository deploys the site once this data changes.
# GitHub may delay or drop scheduled runs under load, so there are two; a sync with no wiki edits commits nothing.
name: Sync from wiki

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-download every page instead of only the changed ones"
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: a3ref/a3ref.github.io
          path: .tool
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .tool/requirements.txt
      - run: pip install -r .tool/requirements.txt
      - run: sudo apt-get install -y xvfb
      # The wiki is behind a Cloudflare challenge: run the real Chrome preinstalled on the runner in a virtual display.
      - working-directory: .tool
        run: xvfb-run --auto-servernum python -m biwiki --raw "$GITHUB_WORKSPACE/raw" sync ${{ inputs.full && '--full' || '' }}
      - working-directory: .tool
        run: python -m biwiki --raw "$GITHUB_WORKSPACE/raw" --dataset "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/out" build
      - run: |
          git add raw commands.json functions.json topics.json index.json syntax.json schema.json
          if git diff --cached --quiet; then
            echo "No changes on the wiki."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from BI wiki $(date -u +%F)"
          git pull --rebase origin main
          git push
